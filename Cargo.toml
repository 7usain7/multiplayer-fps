[package]
name = "multiplayer-fps"
version = "0.1.0"
edition = "2021"

[lib]
name = "multiplayer_fps"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[dependencies]
macroquad = "0.4"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
rand = "0.8"

